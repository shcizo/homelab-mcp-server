version: '3.8'

services:
  # Remote access mode (HTTP/SSE) - recommended for homelab
  homelab-mcp:
    image: ghcr.io/shcizo/homelab-mcp-server:latest
    container_name: homelab-mcp
    user: root        # Required for Docker socket access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

    # HTTP/SSE mode for remote access
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080

    ports:
      - "8080:8080"   # Expose MCP server for remote access

    # Optional: Add to specific network
    # networks:
    #   - homelab

    # Optional: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

  # Local access mode (stdio) - only for same-machine use
  # Uncomment this if you want stdio mode instead
  # homelab-mcp-stdio:
  #   image: ghcr.io/shcizo/homelab-mcp-server:latest
  #   container_name: homelab-mcp-stdio
  #   stdin_open: true  # -i flag equivalent
  #   tty: false        # We don't need -t for MCP communication
  #   user: root
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   restart: unless-stopped
  #   environment:
  #     - MCP_TRANSPORT=stdio

# Optional: Define custom networks
# networks:
#   homelab:
#     driver: bridge
