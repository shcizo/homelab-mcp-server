[project]
name = "homelab-mcp-server"
version = "0.1.0"
description = "MCP server for managing Docker containers in a homelab environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",           # MCP SDK - core protocol implementation
    "docker>=7.0.0",        # Docker SDK - interact with Docker daemon
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",        # Testing framework
    "pytest-asyncio>=0.23.0", # Async test support
]

[build-system]
requires = ["hatchling"]    # Build tool (like MSBuild)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp"]
